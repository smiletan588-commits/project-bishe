server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/smartpm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.smartpm: debug

# Actuator — Docker 健康检查使用 /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: always

# AI 大模型配置（兼容 OpenAI 协议）
ai:
  api-key: ${AI_API_KEY:}
  base-url: https://183.253.56.58
  model: deepseek-v4-flash
