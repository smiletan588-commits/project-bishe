version: "3.8"

services:
  # ── MySQL 8.0 ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smartpm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: smartpm
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smartpm-net
    restart: unless-stopped

  # ── Redis 7 ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartpm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartpm-net
    restart: unless-stopped

  # ── Spring Boot 后端 ───────────────────────────────────
  backend:
    build: .
    container_name: smartpm-backend
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - REDIS_HOST=redis
      - AI_API_KEY=${AI_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartpm-net
    restart: unless-stopped

  # ── Nginx（前端静态资源 + 反向代理）───────────────────
  nginx:
    image: nginx:alpine
    container_name: smartpm-nginx
    volumes:
      - ./kanban-frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartpm-net
    restart: unless-stopped

# ── 持久化卷 ─────────────────────────────────────────────
volumes:
  mysql-data:
  redis-data:

# ── 内部网络 ─────────────────────────────────────────────
networks:
  smartpm-net:
    driver: bridge
